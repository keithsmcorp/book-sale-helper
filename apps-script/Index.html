<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Book Sale Helper</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
:root {
  color-scheme: light;
  --bg: #f4f1ea;
  --card: #ffffff;
  --ink: #1c1917;
  --ink-2: #57534e;
  --ink-3: #78716c;
  --line: #e7e2d9;
  --brand: #1f3a5f;
  --brand-ink: #ffffff;
  --accent: #15803d;
  --accent-ink: #ffffff;
  --danger: #b91c1c;
  --warn-bg: #fff7e6;
  --warn-line: #f5c26b;
  --focus: #2563eb;

  --t1: #6b7280; --t1-bg: #f3f4f6;
  --t2: #15803d; --t2-bg: #dcfce7;
  --t3: #b45309; --t3-bg: #fef3c7;
  --t4: #6d28d9; --t4-bg: #ede9fe;

  --radius: 14px;
  --tap: 56px;
  font-size: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--brand); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: var(--brand); color: var(--brand-ink);
}
.topbar h1 { font-size: 1.15rem; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip {
  border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); color: #fff;
  border-radius: 999px; padding: 8px 12px; font-size: .85rem; min-height: 44px; max-width: 36vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gear {
  border: none; background: transparent; color: rgba(255,255,255,.75); font-size: 1.4rem;
  width: 44px; height: 44px; border-radius: 50%;
}
.banner {
  background: var(--warn-bg); border-bottom: 1px solid var(--warn-line);
  padding: 10px 16px; font-size: .9rem; text-align: center;
}

.wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 120px; }

/* ---------- Mode picker ---------- */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  display: flex; align-items: center; gap: 10px; text-align: left;
  min-height: 64px; padding: 10px 12px;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
}
.mode .ic { font-size: 1.4rem; }
.mode b { display: block; font-size: 1rem; line-height: 1.2; }
.mode .muted { display: block; font-size: .8rem; line-height: 1.2; margin-top: 2px; }
#result, #rapidPanel { scroll-margin-top: 72px; }
.mode[aria-pressed="true"] { border-color: var(--brand); background: #eaf0f8; box-shadow: inset 0 0 0 1px var(--brand); }
.mode-help { margin: 10px 2px 14px; color: var(--ink-2); font-size: .95rem; }

.seg { display: flex; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 4px; gap: 4px; }
.seg button {
  flex: 1; min-height: 48px; border: none; border-radius: 10px; background: transparent; font-weight: 600; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.row-label { font-weight: 700; margin: 0 2px 6px; font-size: .95rem; }

/* ---------- Cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 14px; }
.card h2 { font-size: 1.05rem; margin: 0 0 10px; }
.muted { color: var(--ink-3); font-size: .9rem; }

/* ---------- Entry ---------- */
.entry-row { display: flex; gap: 8px; }
.big-input {
  flex: 1; min-width: 0; min-height: var(--tap); font-size: 1.35rem; letter-spacing: .03em;
  padding: 10px 14px; border: 2px solid #cfc8bb; border-radius: 12px; background: #fff;
}
.big-input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
.btn {
  min-height: var(--tap); padding: 0 18px; border-radius: 12px; border: 2px solid #cfc8bb; background: #fff;
  font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.small { min-height: 44px; font-size: .9rem; padding: 0 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.entry-alt { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.entry-alt .btn { flex-direction: column; gap: 2px; padding: 8px 6px; font-size: .85rem; min-height: 72px; text-align: center; }
.entry-alt .btn span { font-size: 1.4rem; }
.msg { margin-top: 8px; font-weight: 600; min-height: 0; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--accent); }

/* ---------- Result ---------- */
.book { display: flex; gap: 14px; align-items: flex-start; }
.cover { width: 84px; min-width: 84px; height: 124px; border-radius: 6px; background: #ece7dd; object-fit: cover; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #b9b0a0; }
.book h2 { font-size: 1.2rem; margin: 0 0 4px; }
.book .by { color: var(--ink-2); margin-bottom: 4px; }
.book .meta { color: var(--ink-3); font-size: .85rem; }

.verdict { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 14px; border-radius: var(--radius); }
.dot {
  width: 84px; height: 84px; min-width: 84px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  color: #fff; font-weight: 800; font-size: 1.25rem; line-height: 1;
}
.dot small { font-size: .65rem; font-weight: 600; margin-top: 3px; opacity: .9; }
.dot.low { outline: 3px dashed #57534e; outline-offset: 4px; }
.verdict .lvl { font-size: 1.5rem; font-weight: 800; }
.verdict .why { font-size: .88rem; color: var(--ink-2); margin-top: 2px; }
.verdict .lowtxt { font-size: .88rem; font-weight: 700; margin-top: 4px; }
.t1 .dot { background: var(--t1); } .t1.verdict { background: var(--t1-bg); } .t1 .lvl { color: #374151; }
.t2 .dot { background: var(--t2); } .t2.verdict { background: var(--t2-bg); } .t2 .lvl { color: var(--t2); }
.t3 .dot { background: var(--t3); } .t3.verdict { background: var(--t3-bg); } .t3 .lvl { color: var(--t3); }
.t4 .dot { background: var(--t4); } .t4.verdict { background: var(--t4-bg); } .t4 .lvl { color: var(--t4); }
.none .dot { background: #fff; color: var(--ink-3); border: 3px dashed #cfc8bb; } .none.verdict { background: #faf8f4; border: 1px dashed #cfc8bb; }
.mini-dot { width: 18px; height: 18px; min-width: 18px; border-radius: 50%; display: inline-block; vertical-align: middle; }
.mini-dot.t1 { background: var(--t1); } .mini-dot.t2 { background: var(--t2); } .mini-dot.t3 { background: var(--t3); } .mini-dot.t4 { background: var(--t4); }
.mini-dot.none { background: #fff; border: 2px dashed #cfc8bb; }
.mini-dot.wait { background: #fff; border: 3px solid #cfc8bb; border-top-color: var(--brand); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.suggest { margin-top: 12px; font-size: 1.05rem; }
.suggest b { font-size: 1.25rem; }

.est-box { margin-top: 14px; padding: 14px; border: 2px solid var(--line); border-radius: var(--radius); background: #fcfbf8; }
.est-box label { font-weight: 700; display: block; margin-bottom: 6px; }
.money { display: flex; align-items: center; gap: 8px; }
.money .cur { font-size: 1.4rem; font-weight: 700; color: var(--ink-2); }
.money input { max-width: 160px; }
.est-note { margin-top: 6px; font-size: .88rem; color: var(--ink-2); }
.linkish { background: none; border: none; color: var(--brand); text-decoration: underline; padding: 6px 2px; font-size: .9rem; min-height: 36px; }

.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.links .btn { min-height: 52px; font-size: .92rem; justify-content: flex-start; padding: 0 12px; white-space: nowrap; }
.links .btn.hl { border-color: var(--brand); color: var(--brand); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats div { background: #faf8f4; border-radius: 10px; padding: 8px 4px; }
.stats b { display: block; font-size: 1.1rem; }
.stats span { font-size: .75rem; color: var(--ink-3); }

.listings { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
.listing {
  flex: 0 0 150px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: #fff; text-decoration: none; color: var(--ink);
}
.listing img { width: 100%; height: 130px; object-fit: contain; background: #f5f3ee; display: block; }
.listing .noimg { height: 130px; background: #f5f3ee; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #c9c1b3; }
.listing div.t { padding: 8px; font-size: .78rem; line-height: 1.25; height: 3.6em; overflow: hidden; }
.listing div.p { padding: 0 8px 8px; font-weight: 800; }
.listing div.p small { font-weight: 400; color: var(--ink-3); }

.dup {
  margin-top: 14px; padding: 14px; border-radius: var(--radius); background: var(--warn-bg); border: 2px solid var(--warn-line);
}
.dup b { display: block; font-size: 1.05rem; margin-bottom: 8px; }
.dup .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.dup .btns .btn { flex: 1; min-width: 140px; }

/* ---------- Detailed form ---------- */
.field { margin-top: 16px; }
.field > label, .field > .label { display: block; font-weight: 700; margin-bottom: 6px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choices button {
  min-height: 52px; padding: 0 10px; border-radius: 12px; border: 2px solid #cfc8bb; background: #fff; font-weight: 600;
}
.choices button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.stepper { display: flex; align-items: center; gap: 0; }
.stepper button { width: var(--tap); height: var(--tap); font-size: 1.6rem; font-weight: 700; border: 2px solid #cfc8bb; background: #fff; }
.stepper button:first-child { border-radius: 12px 0 0 12px; }
.stepper button:last-child { border-radius: 0 12px 12px 0; }
.stepper input { width: 80px; height: var(--tap); text-align: center; font-size: 1.4rem; font-weight: 700; border: 2px solid #cfc8bb; border-left: none; border-right: none; }
.text-input { width: 100%; min-height: 52px; padding: 10px 14px; border: 2px solid #cfc8bb; border-radius: 12px; background: #fff; }
textarea.text-input { min-height: 80px; resize: vertical; }

.actions {
  position: sticky; bottom: 0; z-index: 10; margin: 18px -16px -16px; padding: 12px 16px;
  background: linear-gradient(rgba(255,255,255,0), #fff 30%); display: flex; gap: 10px;
}
.actions .btn { flex: 1; font-size: 1.1rem; min-height: 60px; }
.actions .btn.go { flex: 2; }

/* ---------- Rapid list ---------- */
.ready {
  display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--radius);
  background: #eaf6ee; border: 2px solid #9fd5b0; font-weight: 700; font-size: 1.1rem; margin-top: 14px;
}
.pulse { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(.8); opacity: .6 } 50% { transform: scale(1.15); opacity: 1 } }
.scanlist { list-style: none; margin: 0; padding: 0; }
.scanlist li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.scanlist li:last-child { border-bottom: none; }
.scanlist .t { flex: 1; min-width: 0; }
.scanlist .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scanlist .t span { font-size: .82rem; color: var(--ink-3); }
.scanlist .v { font-weight: 800; white-space: nowrap; }
.tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); border: 1px solid var(--warn-line); margin-left: 4px; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(20,18,15,.55);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 20px 16px 24px;
}
@media (min-width: 700px) { .modal-back { align-items: center; } .modal { border-radius: 20px; } }
.modal h2 { margin: 0 0 6px; font-size: 1.3rem; }
.modal p { margin: 0 0 14px; color: var(--ink-2); }
.modal .stack { display: flex; flex-direction: column; gap: 10px; }
.cam-box { position: relative; background: #000; border-radius: 14px; overflow: hidden; min-height: 240px; }
#camReader { width: 100%; }
#camReader video { width: 100% !important; display: block; }
.cam-flash { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(21,128,61,.92); color: #fff; padding: 10px 12px; border-radius: 10px; font-weight: 700; }
.pick { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; border: 2px solid var(--line); border-radius: 12px; background: #fff; width: 100%; }
.pick img, .pick .ph { width: 44px; height: 64px; object-fit: cover; border-radius: 4px; background: #ece7dd; flex: 0 0 44px; }
.pick b { display: block; }
.pick span { font-size: .85rem; color: var(--ink-3); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  background: #1c1917; color: #fff; padding: 14px 20px; border-radius: 12px; font-weight: 600;
  max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid #d6d0c4; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
.loading { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-weight: 600; }

/* ---------- Settings ---------- */
.set-head { display: flex; align-items: center; gap: 10px; }
.set-head h2 { flex: 1; margin: 0; }
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.set-grid .full { grid-column: 1 / -1; }
.set-field label { display: block; font-weight: 700; font-size: .92rem; margin-bottom: 4px; }
.set-field .help { font-size: .8rem; color: var(--ink-3); margin-top: 3px; }
.set-field input[type="text"], .set-field input[type="number"], .set-field input[type="password"], .set-field select, .set-field textarea {
  width: 100%; min-height: 48px; padding: 8px 12px; border: 2px solid #cfc8bb; border-radius: 10px; background: #fff;
}
.set-field textarea { min-height: 120px; }
.tier-row { display: grid; grid-template-columns: 26px 1fr 120px; gap: 10px; align-items: center; margin-bottom: 10px; }
.tier-row .from { font-size: .85rem; color: var(--ink-3); }
.switch { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; }
.switch input { width: 26px; height: 26px; }
.status-ok { color: var(--accent); font-weight: 700; }
.status-no { color: var(--ink-3); font-weight: 700; }
.save-bar { position: sticky; bottom: 0; padding: 12px 0; background: linear-gradient(rgba(244,241,234,0), var(--bg) 30%); }

@media (max-width: 420px) {
  :root { font-size: 17px; }
  .entry-alt .btn { font-size: .78rem; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .set-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <header class="topbar">
    <h1 id="appName">📚 Book Sale Helper</h1>
    <button id="whoBtn" class="chip" type="button" aria-label="Change who is scanning">👤 <span id="whoName">Your name</span></button>
    <button id="gearBtn" class="gear" type="button" aria-label="Settings (for the tool's organizer)">⚙︎</button>
  </header>
  <div id="demoBanner" class="banner hidden">
    <b>Practice mode.</b> Titles and covers are real, prices are made up, and nothing goes to the spreadsheet.
  </div>

  <!-- ============ Scan screen ============ -->
  <main id="scanView" class="wrap">
    <div class="modes" role="group" aria-label="What are you doing?">
      <button class="mode" type="button" data-mode="quick"><span class="ic">🔍</span><span><b>Quick Check</b><span class="muted">Nothing saved</span></span></button>
      <button class="mode" type="button" data-mode="detailed"><span class="ic">📝</span><span><b>One at a Time</b><span class="muted">Save with details</span></span></button>
      <button class="mode" type="button" data-mode="rapid"><span class="ic">⚡</span><span><b>Rapid Scan</b><span class="muted">Scan many, save all</span></span></button>
      <button class="mode" type="button" data-mode="sold"><span class="ic">🏷️</span><span><b>Mark Sold</b><span class="muted">At the sale</span></span></button>
    </div>
    <p id="modeHelp" class="mode-help"></p>

    <div id="condWrap">
      <div class="row-label">Price these books as:</div>
      <div class="seg" role="group" aria-label="Price as used or new">
        <button type="button" data-cond="used">Used</button>
        <button type="button" data-cond="new">New</button>
      </div>
    </div>

    <section class="card" aria-label="Find a book">
      <label for="isbnInput" class="row-label" style="display:block">ISBN</label>
      <form id="isbnForm" class="entry-row" autocomplete="off">
        <input id="isbnInput" class="big-input" inputmode="numeric" enterkeyhint="search" placeholder="Scan or type ISBN" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="btn primary" type="submit">Look up</button>
      </form>
      <div id="entryMsg" class="msg" role="status" aria-live="polite"></div>
      <div class="entry-alt">
        <button id="camBtn" class="btn" type="button"><span>📷</span>Scan barcode with camera</button>
        <button id="photoBtn" class="btn" type="button"><span>🖼️</span>Photo of the ISBN</button>
        <button id="titleBtn" class="btn" type="button"><span>🔎</span>No ISBN? Search title</button>
      </div>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
    </section>

    <section id="rapidPanel" class="hidden" aria-live="polite"></section>
    <section id="result" class="hidden" aria-live="polite"></section>
  </main>

  <!-- ============ Settings screen ============ -->
  <main id="settingsView" class="wrap hidden"></main>

  <div id="modalBack" class="modal-back hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
/* ---- config.js ---- */
window.BOOK_TOOL_CONFIG = { backendUrl: '' }; // Served by Apps Script: uses google.script.run.
</script>
  <script>
/* ---- isbn.js ---- */
// ISBN helpers: clean up typed/scanned input, check the check digit, convert 10 <-> 13.
window.ISBN = (() => {
  const clean = (raw) => String(raw || '').toUpperCase().replace(/[^0-9X]/g, '');

  function valid10(s) {
    if (!/^\d{9}[\dX]$/.test(s)) return false;
    let sum = 0;
    for (let i = 0; i < 10; i++) sum += (s[i] === 'X' ? 10 : +s[i]) * (10 - i);
    return sum % 11 === 0;
  }

  function valid13(s) {
    if (!/^\d{13}$/.test(s)) return false;
    let sum = 0;
    for (let i = 0; i < 13; i++) sum += +s[i] * (i % 2 ? 3 : 1);
    return sum % 10 === 0;
  }

  function to13(s10) {
    const core = '978' + s10.slice(0, 9);
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += +core[i] * (i % 2 ? 3 : 1);
    return core + ((10 - (sum % 10)) % 10);
  }

  function to10(s13) {
    if (!s13.startsWith('978')) return null; // 979 ISBNs have no 10-digit form
    const core = s13.slice(3, 12);
    let sum = 0;
    for (let i = 0; i < 9; i++) sum += +core[i] * (10 - i);
    const c = (11 - (sum % 11)) % 11;
    return core + (c === 10 ? 'X' : String(c));
  }

  /** Returns {ok, isbn13, isbn10} or {ok:false, reason, message}. */
  function parse(raw) {
    let s = clean(raw);
    if (!s) return fail('empty', 'Type or scan an ISBN first.');
    // Some scanners add the 2- or 5-digit price code after the ISBN.
    if ((s.length === 15 || s.length === 18) && /^97[89]/.test(s)) s = s.slice(0, 13);
    if (s.length === 13) {
      if (!/^97[89]/.test(s)) return fail('notbook', "That barcode isn't an ISBN — it's probably a store price code. Look for the ISBN on the back cover or the copyright page.");
      if (!valid13(s)) return fail('checksum', 'That ISBN has a typo somewhere. Please check the numbers.');
      return { ok: true, isbn13: s, isbn10: to10(s) };
    }
    if (s.length === 10) {
      if (!valid10(s)) return fail('checksum', 'That ISBN has a typo somewhere. Please check the numbers.');
      return { ok: true, isbn13: to13(s), isbn10: s };
    }
    if (s.length === 12 || s.length === 8) {
      return fail('upc', "That barcode isn't an ISBN — it's a store code (common on older paperbacks). Look for the ISBN on the back cover or the copyright page.");
    }
    return fail('length', 'An ISBN has 10 or 13 digits. Please check the numbers.');
  }

  function fail(reason, message) { return { ok: false, reason, message }; }

  /** Finds valid ISBNs in OCR text from a photo. */
  function findInText(text) {
    const found = new Map();
    const scan = (t) => {
      const re = /(?:97[89][\s\-–.]*)?(?:\d[\s\-–.]*){9}[\dXx]/g;
      let m;
      while ((m = re.exec(t))) {
        const p = parse(m[0]);
        if (p.ok) found.set(p.isbn13, p);
      }
    };
    scan(text);
    // OCR often reads 0 as O and 1 as I or l.
    scan(text.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1'));
    return [...found.values()];
  }

  function pretty(p) { return p.isbn13; }

  return { parse, findInText, pretty };
})();

// Pricing rules shared by the page and Practice mode.
// The same rules live in the spreadsheet as formulas (apps-script/Code.gs) — keep them in step.

window.DEFAULT_SETTINGS = {
  appName: 'Book Sale Helper',
  tier1Name: 'Standard',
  tier2Name: 'Good Find', tier2Min: 5,
  tier3Name: 'Valuable', tier3Min: 15,
  tier4Name: 'High Value', tier4Min: 40,
  askingPct: 70,
  lowDataMin: 3,
  whereOn: true,
  onlineMin: 40,
  pricePaperback: 1, priceHardcover: 2, priceMassMarket: 0.5, priceOther: 1,
  pricePct: 50, priceMin: 1, priceRound: 0.5,
  dupCheck: true,
  rapidDup: 'addCopy',
  beep: true,
  keepaOn: false,
  volunteers: '',
};

window.Logic = (() => {
  const round2 = (n) => Math.round(n * 100) / 100;

  function median(sorted) {
    if (!sorted.length) return null;
    const m = Math.floor(sorted.length / 2);
    return round2(sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2);
  }

  /** The system's guess at a book's value, from eBay asking prices (or Keepa if that's all there is). */
  function estimate(ebay, keepa, s) {
    const pct = Number(s.askingPct) / 100;
    if (ebay && ebay.median != null) {
      return {
        value: round2(ebay.median * pct),
        basis: `eBay asking prices (middle of ${ebay.used}) × ${s.askingPct}%`,
        lowData: ebay.used < Number(s.lowDataMin),
      };
    }
    const k = keepa && (keepa.usedAvg90 || keepa.usedNow);
    if (k) return { value: round2(k * pct), basis: `Amazon used price (Keepa) × ${s.askingPct}%`, lowData: false };
    return { value: null, basis: 'No price data found', lowData: true };
  }

  /** Which of the 4 value levels a $ value falls in. */
  function tier(value, s) {
    if (value == null || value === '' || isNaN(value)) return { key: 'none', name: 'No data' };
    const v = Number(value);
    if (v >= s.tier4Min) return { key: 't4', name: s.tier4Name };
    if (v >= s.tier3Min) return { key: 't3', name: s.tier3Name };
    if (v >= s.tier2Min) return { key: 't2', name: s.tier2Name };
    return { key: 't1', name: s.tier1Name };
  }

  function standardPrice(format, s) {
    if (format === 'Hardcover') return s.priceHardcover;
    if (format === 'Mass market') return s.priceMassMarket;
    if (format === 'Paperback') return s.pricePaperback;
    return s.priceOther;
  }

  /** Suggested sale-day price. Level-1 books use flat prices by format; others are a % of value. */
  function suggestedPrice(value, format, s) {
    if (value == null || value === '' || Number(value) < s.tier2Min) return standardPrice(format, s);
    const step = Number(s.priceRound) || 1;
    const raw = (Number(value) * Number(s.pricePct)) / 100;
    return Math.max(Number(s.priceMin), round2(Math.round(raw / step) * step));
  }

  function whereToSell(value, s) {
    if (!s.whereOn) return '';
    return value != null && value !== '' && Number(value) >= s.onlineMin ? 'Online' : 'Book sale';
  }

  return { round2, median, estimate, tier, standardPrice, suggestedPrice, whereToSell };
})();

  const settings = () => Object.assign({}, window.DEFAULT_SETTINGS, db.settings || {});
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function rng(seed) {
    let h = 2166136261;
    for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  }

  function fakeEbay(key, cond) {
    const r = rng(key + '|' + cond);
    const roll = r();
    const count = roll < 0.12 ? 0 : roll < 0.3 ? 1 + Math.floor(r() * 2) : 3 + Math.floor(r() * 25);
    if (!count) return { total: 0, used: 0, low: null, median: null, high: null, items: [] };
    const band = r();
    const base = band < 0.6 ? 3 + r() * 7 : band < 0.82 ? 10 + r() * 20 : band < 0.94 ? 30 + r() * 40 : 70 + r() * 150;
    const mult = cond === 'new' ? 1.4 : 1;
    const conds = cond === 'new' ? ['Brand New'] : ['Good', 'Very Good', 'Acceptable', 'Like New'];
    const prices = [...Array(count)].map(() => Logic.round2(base * mult * (0.6 + r() * 0.9))).sort((a, b) => a - b);
    const items = prices.slice(0, 24).map((p, i) => ({
      title: '', price: p, ship: r() < 0.4 ? 0 : Logic.round2(3 + r() * 3), cond: conds[i % conds.length],
      auction: r() < 0.15, url: 'https://www.ebay.com/', img: '',
    }));
    return { total: count, used: count, low: prices[0], median: Logic.median(prices), high: prices[prices.length - 1], items };
  }

  function bookView(b) {
    const s = settings();
    const value = b.yourEst !== '' && b.yourEst != null ? Number(b.yourEst) : b.sysEst;
    const sold = db.sales.filter((x) => x.id === b.id).reduce((t, x) => t + x.qty, 0);
    return {
      id: b.id, title: b.title, author: b.author, copies: b.copies, sold, value: value == null ? null : value,
      level: Logic.tier(value, s).name, suggested: Logic.suggestedPrice(value, b.format, s),
      final: b.final === '' || b.final == null ? null : Number(b.final), box: b.box,
    };
  }

  function find(isbn13, title, author, id) {
    const t = String(title || '').trim().toLowerCase();
    const a = String(author || '').trim().toLowerCase();
    return db.books.find((b) => (id && b.id === id) || (isbn13 && b.isbn13 === isbn13) ||
      (!isbn13 && !id && t && b.title.toLowerCase() === t && (!a || b.author.toLowerCase() === a)));
  }

  function addBook(b) {
    const book = Object.assign({}, b, { id: 'B' + String(db.nextId++).padStart(5, '0'), added: new Date().toISOString() });

    persist();

  }

  const handlers = {
    async hello() { return { settings: settings(), ebayReady: true, keepaReady: false }; },

    async lookup(req) {
      await wait(500 + Math.random() * 500);
      const s = settings();
      const key = req.isbn || String(req.title || '').toLowerCase();
      const ebay = fakeEbay(key, req.condition === 'new' ? 'new' : 'used');
      const dupBook = s.dupCheck ? find(req.isbn, req.title, req.author) : null;
      return { ebay, keepa: null, estimate: Logic.estimate(ebay, null, s), dup: dupBook ? bookView(dupBook) : null };
    },

    async save(req) {
      await wait(300);
      const b = req.book;
      if (req.dupId) {
        const ex = find(null, null, null, req.dupId);
        if (ex) {
          ex.copies = (Number(ex.copies) || 1) + (Number(b.copies) || 1);
          persist();
          return { id: ex.id, action: 'addedCopy', copies: ex.copies };
        }
      }
      const book = addBook(b);
      return { id: book.id, action: 'added', copies: book.copies };
    },

    async rapidSave(req) {
      const s = settings();

      if (ex && s.rapidDup !== 'newRow') {
        await wait(300);
        ex.copies = (Number(ex.copies) || 1) + 1;
        persist();
        const v = bookView(ex);
        return { dup: true, id: ex.id, title: ex.title, copies: ex.copies, value: v.value, level: v.level };
      }
      const meta = req.isbn ? await window.fetchMeta({ isbn13: req.isbn }) : { title: req.title, author: req.author };
      const key = req.isbn || String(req.title || '').toLowerCase();
      const ebay = fakeEbay(key, req.condition === 'new' ? 'new' : 'used');
      const est = Logic.estimate(ebay, null, s);
      await wait(400 + Math.random() * 900);
      const book = addBook({
        isbn13: req.isbn || '', title: (meta && meta.title) || req.title || '', author: (meta && meta.author) || req.author || '',
        year: (meta && meta.year) || '', copies: 1, searched: req.condition, sysEst: est.value, basis: est.basis,
        ebayCount: ebay.used, by: req.by, mode: 'Rapid Scan', format: '',
      });
      return { id: book.id, dup: !!ex, title: book.title, value: est.value, lowData: est.lowData, ebayCount: ebay.used };

    async findBook(req) {

      const b = find(req.isbn, req.title, req.author);
      return { book: b ? bookView(b) : null };
    },

    async markSold(req) {

      persist();
      return { recorded: true };
    },

    async adminLogin(req) {
      await wait(200);
      if (String(req.pin || '').trim() !== db.pin) throw new Error('That PIN is not right. (In Practice mode the PIN is 1234.)');
      return adminInfo();
    },

    async saveSettings(req) {
      await wait(300);
      if (String(req.pin || '').trim() !== db.pin) throw new Error('That PIN is not right.');
      db.settings = Object.assign(settings(), req.settings || {});
      const sec = req.secrets || {};
      if (sec.adminPin) db.pin = String(sec.adminPin).trim();
      if (sec.teamCode) db.team = String(sec.teamCode).trim();
      persist();
      return Object.assign(adminInfo(), { ebayTest: null });
    },
  };

  function adminInfo() {
    return {
      settings: settings(), ebayReady: true, keepaReady: false,
      secrets: { teamCodeSet: !!db.team, adminPinIsDefault: db.pin === '1234', ebayIdSet: false, ebaySecretSet: false, keepaKeySet: false },
      sheetUrl: '', bookCount: db.books.length, practice: true,

  async function call(action, data) {
    const h = handlers[action];
    if (!h) throw new Error('Unknown action ' + action);
    return Object.assign({ ok: true }, await h(data || {}));
  }

  function reset() { db = blank(); persist(); }
  function dump() { return JSON.parse(JSON.stringify(db)); }

  return { call, reset, dump };
})();

      $$('#modal [data-name]').forEach((b) => b.addEventListener('click', () => setName(b.dataset.name)));
      $('#nameOk').addEventListener('click', () => setName($('#otherName').value));
      $('#otherName').addEventListener('keydown', (e) => { if (e.key === 'Enter') setName($('#otherName').value); });
    });
  }

  let askingTeam = false;
  function askTeamCode() {
    if (askingTeam) return;
    askingTeam = true;
    showModal(`<h2>Enter the team code</h2><p>Ask the book sale organizer for the team code. You only need to do this once on this phone or computer.</p>
      <div class="stack"><input id="teamIn" class="text-input" autocomplete="off" autocapitalize="off" placeholder="Team code" autofocus>
      <button id="teamOk" class="btn primary wide" type="button">Save</button></div>`, () => { askingTeam = false; });
    const save = () => {
      ls.set('team', $('#teamIn').value.trim());
      hideModal();
      hello().then(() => toast('Connected ✓'));
    };
    $('#teamOk').addEventListener('click', save);
    $('#teamIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  }

  /* ---------------- Settings from the sheet ---------------- */
  function applySettings(s) {
    S.settings = Object.assign({}, window.DEFAULT_SETTINGS, s);
    ls.set('settings', S.settings);
    $('#appName').textContent = '📚 ' + S.settings.appName;
    document.title = S.settings.appName;
  }

  async function hello() {
    try {
      const r = await api('hello');
      applySettings(r.settings);
      S.ebayReady = r.ebayReady; S.keepaReady = r.keepaReady;
      return true;
    } catch (e) {
      if (e.code !== 'TEAM') setMsg(esc(e.message), 'err');
      return false;
    }
  }

  /* ---------------- Mode + condition ---------------- */
  function setMode(m) {
    S.mode = m;
    ls.set('mode', m);
    $$('.mode').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    $('#modeHelp').innerHTML = MODE_HELP[m];
    $('#condWrap').classList.toggle('hidden', m === 'sold');
    $('#rapidPanel').classList.toggle('hidden', m !== 'rapid');
    S.current = null;
    $('#result').classList.add('hidden');
    $('#result').innerHTML = '';
    setMsg('');
    if (m === 'rapid') renderRapid();
    if ((m === 'rapid' || m === 'detailed' || m === 'sold') && !S.who) pickName();
    focusInput();
  }

  function setCond(c) {
    S.cond = c;
    ls.set('cond', c);
    $$('[data-cond]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cond === c)));
    if (S.current && S.current.kind === 'book') openBook({ p: S.current.p, meta: S.current.meta, skipBeep: true });
  }

  function focusInput() {
    if (isFinePointer && !modalOpen()) $('#isbnInput').focus();
  }

  /* ---------------- Entry: what happens when an ISBN comes in ---------------- */
  async function handleCode(raw) {
    if (!$('#settingsView').classList.contains('hidden')) return;
    const p = ISBN.parse(raw);
    if (!p.ok) {
      beep(false);
      setMsg(esc(p.message), 'err');
      return false;
    }
    setMsg('');
    $('#isbnInput').value = '';
    await dispatch({ p });
    return true;
  }

  async function dispatch({ p, meta }) {
    if (S.mode === 'rapid') return rapidAdd({ p, meta });
    if (S.mode === 'sold') return soldOpen({ p, meta });
    if (S.mode === 'detailed' && S.current && S.current.kind === 'book' && S.current.dirty && !S.current.saved) {
      const t = (S.current.meta && S.current.meta.title) || 'the last book';
      const pick = await choose('Save the last book first?', `You haven't saved <b>${esc(t)}</b> yet.`, [
        { label: '✅ Save it, then go on', value: 'save', cls: 'go' },
        { label: "Don't save it", value: 'skip' },
        { label: 'Go back', value: null },
      ]);
      if (!pick) return;
      if (pick === 'save') { const ok = await saveCurrent(); if (!ok) return; }
    }
    return openBook({ p, meta });
  }

  /* ---------------- Quick Check + One at a Time ---------------- */
  function newForm() {
    return { copies: 1, format: '', condition: 'Good', first: false, signed: false, where: '', final: '', box: ls.get('lastBox', ''), notes: '', dupChoice: 'addCopy' };
  }

  async function openBook({ p, meta, skipBeep }) {
    if (!skipBeep) beep(true);
    const cur = {
      kind: 'book', p: p || null, meta: meta || null, metaDone: !!meta || !p, look: null, lookErr: '',
      yourEst: '', form: newForm(), dirty: false, saved: null, saving: false,
    };
    S.current = cur;
    renderBook();
    $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });

    if (!meta && p) {
      fetchMeta(p).then((m) => {
        if (S.current !== cur) return;
        cur.meta = m; cur.metaDone = true; renderBook(true);
      });
    }
    try {
      const look = await api('lookup', {
        isbn: p ? p.isbn13 : '', title: meta && meta.title, author: meta && meta.author, condition: S.cond,
      });
      if (S.current !== cur) return;
      cur.look = look;
    } catch (e) {
      if (S.current !== cur) return;
      cur.lookErr = e.message;
    }
    renderBook(true);
  }

  /** The number that drives the color: your estimate if typed, else the system's. */
  function valueInfo(cur) {
    const mine = num(cur.yourEst);
    const est = cur.look && cur.look.estimate;
    if (mine != null) return { value: mine, mine: true, basis: `Your estimate (${S.who || 'you'})`, lowData: false };
    if (est) return { value: est.value, mine: false, basis: est.basis, lowData: est.lowData };
    return null;
  }

  function verdictHtml(cur) {
    const s = S.settings;
    if (!cur.look && !cur.lookErr && num(cur.yourEst) == null) {
      return `<div class="verdict none"><div class="loading"><span class="spinner"></span> Checking prices…</div></div>`;
    }
    const vi = valueInfo(cur) || { value: null, basis: cur.lookErr ? 'Price lookup failed: ' + cur.lookErr : 'No price data found', lowData: true };
    const t = Logic.tier(vi.value, s);
    const noSource = cur.look && cur.look.ebay && cur.look.ebay.notConfigured && !(cur.look.keepa && cur.look.keepa.found);
    let why = esc(vi.basis);
    if (vi.value == null && noSource) why = 'eBay isn’t connected yet — use the links below to check prices.';
    const low = vi.value != null && vi.lowData && !vi.mine;
    return `<div class="verdict ${t.key}">
      <div class="dot ${low ? 'low' : ''}" aria-hidden="true">${vi.value != null ? (vi.value >= 10 ? '$' + Math.round(vi.value) : money(vi.value)) : '?'}${vi.value != null ? '<small>value</small>' : ''}</div>
      <div><div class="lvl">${esc(t.name)}</div><div class="why">${why}</div>
      ${low ? '<div class="lowtxt">⚠️ Not much data — check the links below.</div>' : ''}
      ${vi.value == null ? '<div class="lowtxt">Type your own estimate below if you know it.</div>' : ''}</div></div>`;
  }

  function suggestHtml(cur) {
    const s = S.settings;
    const vi = valueInfo(cur);
    const v = vi ? vi.value : null;
    if (S.mode === 'detailed' && cur.form.format) {
      return `<div class="suggest">Suggested sale price: <b>${money(Logic.suggestedPrice(v, cur.form.format, s))}</b></div>`;
    }
    if (v == null || v < s.tier2Min) {
      return `<div class="suggest">Suggested sale price: <b>${money(s.pricePaperback)}</b> paperback · <b>${money(s.priceHardcover)}</b> hardcover</div>`;
    }
    const where = Logic.whereToSell(v, s);
    return `<div class="suggest">Suggested sale price: <b>${money(Logic.suggestedPrice(v, '', s))}</b>${where === 'Online' ? ' · <b>consider selling online</b>' : ''}</div>`;
  }

  function bookHeaderHtml(p, meta, metaDone) {
    const isbn = p ? p.isbn13 : '';
    let cover = '<div class="cover">📖</div>';
    const src = (meta && meta.cover) || (isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : '');
    if (src) cover = `<img class="cover" src="${esc(src)}" alt="" onerror="this.outerHTML='<div class=&quot;cover&quot;>📖</div>'">`;
    let title;
    if (meta && meta.title) title = `<h2>${esc(meta.title)}</h2>${meta.author ? `<div class="by">${esc(meta.author)}</div>` : ''}`;
    else if (!metaDone) title = `<div class="loading"><span class="spinner"></span> Finding the title…</div>`;
    else title = `<h2>Title not found</h2><div class="by muted">The price links below still work.</div>`;
    const bits = [meta && meta.year, meta && meta.publisher, isbn && 'ISBN ' + isbn].filter(Boolean).map(esc).join(' · ');
    return `<div class="book">${cover}<div>${title}<div class="meta">${bits}</div></div></div>`;
  }

  /** keepFocus: data arrived in the background — don't kick the person out of the box they're typing in. */
  function renderBook(keepFocus = false) {
    const cur = S.current;
    if (!cur || cur.kind !== 'book') return;
    const s = S.settings;
    const look = cur.look || {};
    const ebay = look.ebay;
    const keepa = look.keepa;
    const dup = look.dup;
    const detailed = S.mode === 'detailed';
    const html = [];

    html.push(`<div class="card">${bookHeaderHtml(cur.p, cur.meta, cur.metaDone)}`);

    if (dup && !cur.saved) {
      const where = dup.box ? ` · Box ${esc(dup.box)}` : '';
      if (detailed) {
        html.push(`<div class="dup"><b>📋 Already on the list (${esc(dup.copies)} ${dup.copies == 1 ? 'copy' : 'copies'}${where})</b>
          <div class="choices" data-group="dupChoice">
            <button type="button" data-v="addCopy" aria-pressed="${cur.form.dupChoice === 'addCopy'}">Add to that entry</button>
            <button type="button" data-v="new" aria-pressed="${cur.form.dupChoice === 'new'}">Save as separate entry</button>
          </div></div>`);
      } else {
        html.push(`<div class="dup"><b>📋 Already on the list — ${esc(dup.copies)} ${dup.copies == 1 ? 'copy' : 'copies'}${where}</b>
          ${dup.final != null ? `Priced at ${money(dup.final)}.` : ''}</div>`);
      }
    }

    html.push(`<div id="verdictSlot">${verdictHtml(cur)}</div><div id="suggestSlot">${suggestHtml(cur)}</div>`);

    html.push(`<div class="est-box"><label for="yourEst">Your price estimate <span class="muted">(optional)</span></label>
      <div class="money"><span class="cur">$</span><input id="yourEst" data-f="yourEst" class="big-input" inputmode="decimal" placeholder="0.00" value="${esc(cur.yourEst)}" autocomplete="off"></div>
      <div class="est-note" id="estNote">${num(cur.yourEst) != null
        ? `Using your number. <button type="button" class="linkish" data-act="clearEst">Use the system's number instead</button>`
        : 'If you know better, type what you think it’s worth. Your number replaces the system’s guess.'}</div></div>`);
    html.push('</div>');

    // Links out
    html.push(`<div class="card"><h2>Check prices yourself</h2><div class="links">${siteLinks(cur.p, cur.meta, S.cond).map((l) =>
      `<a class="btn ${l.hl ? 'hl' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>
      <p class="muted" style="margin:10px 0 0">“eBay sold” shows what buyers actually paid (about the last 3 months).</p></div>`);

    // eBay current listings
    if (ebay && !ebay.notConfigured) {
      html.push('<div class="card"><h2>On eBay right now <span class="muted">(asking prices, not sold prices)</span></h2>');
      if (ebay.error) {
        html.push(`<p class="msg err">Couldn't get eBay listings: ${esc(ebay.error)}</p>`);
      } else if (!ebay.used) {
        html.push('<p class="muted" style="margin:0">No copies listed for sale on eBay right now.</p>');
      } else {
        html.push(`<div class="stats"><div><b>${ebay.used}</b><span>for sale</span></div><div><b>${money(ebay.low)}</b><span>lowest</span></div>
          <div><b>${money(ebay.median)}</b><span>middle</span></div><div><b>${money(ebay.high)}</b><span>highest</span></div></div>
          <div class="listings" style="margin-top:12px">${ebay.items.map((it) => {
            const img = it.img || (cur.meta && cur.meta.cover) || '';
            const ttl = it.title || ((cur.meta && cur.meta.title) || 'Listing') + ' — ' + it.cond;
            return `<a class="listing" href="${esc(it.url)}" target="_blank" rel="noopener">
              ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<div class="noimg">📖</div>'}
              <div class="t">${esc(ttl)}</div>
              <div class="p">${money(it.price)} <small>${it.ship ? '+ ' + money(it.ship) + ' ship' : it.ship === 0 ? 'free ship' : ''}${it.auction ? ' · auction' : ''}</small></div></a>`;
          }).join('')}</div>
          <p class="muted" style="margin:4px 0 0">Swipe sideways to see more. Tap one to open it on eBay.</p>`);
      }
      html.push('</div>');
    }

    // Keepa (optional, paid)
    if (keepa && keepa.found) {
      const rank = keepa.salesRank;
      const pace = rank == null ? '' : rank < 100000 ? 'sells often' : rank < 1000000 ? 'sells now and then' : 'sells rarely';
      html.push(`<div class="card"><h2>Amazon (from Keepa)</h2><div class="stats">
        <div><b>${money(keepa.usedNow)}</b><span>used now</span></div><div><b>${money(keepa.usedAvg90)}</b><span>used, 90-day avg</span></div>
        <div><b>${money(keepa.newNow)}</b><span>new now</span></div><div><b>${rank ? rank.toLocaleString() : '—'}</b><span>sales rank${pace ? ' · ' + pace : ''}</span></div></div></div>`);
    } else if (keepa && keepa.error) {
      html.push(`<div class="card"><p class="msg err" style="margin:0">Keepa lookup failed: ${esc(keepa.error)}</p></div>`);
    }

    // One at a Time: details form
    if (detailed && !cur.saved) {
      const f = cur.form;
      const where = f.where || Logic.whereToSell(valueInfo(cur) && valueInfo(cur).value, s);
      html.push(`<div class="card"><h2>Details for the list</h2>
        <div class="field"><span class="label">How many copies?</span><div class="stepper">
          <button type="button" data-act="copies-" aria-label="One fewer">−</button>
          <input data-f="copies" inputmode="numeric" value="${esc(f.copies)}" aria-label="Copies">
          <button type="button" data-act="copies+" aria-label="One more">+</button></div></div>
        <div class="field"><span class="label">Format</span><div class="choices" data-group="format">
          ${['Paperback', 'Hardcover', 'Mass market', 'Other'].map((x) => `<button type="button" data-v="${x}" aria-pressed="${f.format === x}">${x}</button>`).join('')}</div></div>
        <div class="field"><span class="label">Condition</span><div class="choices" data-group="condition">
          ${['Like new', 'Good', 'Fair', 'Poor'].map((x) => `<button type="button" data-v="${x}" aria-pressed="${f.condition === x}">${x}</button>`).join('')}</div></div>
        <div class="field"><span class="label">Special?</span><div class="choices">
          <button type="button" data-toggle="first" aria-pressed="${f.first}">First edition</button>
          <button type="button" data-toggle="signed" aria-pressed="${f.signed}">Signed</button></div></div>
        ${s.whereOn ? `<div class="field"><span class="label">Where to sell</span><div class="choices" data-group="where">
          ${['Book sale', 'Online'].map((x) => `<button type="button" data-v="${x}" aria-pressed="${where === x}">${x}${!f.where && where === x ? ' (suggested)' : ''}</button>`).join('')}</div></div>` : ''}
        <div class="field"><label for="finalIn">Price to put on it <span class="muted">(optional)</span></label>
          <div class="money"><span class="cur">$</span><input id="finalIn" data-f="final" class="big-input" inputmode="decimal" placeholder="${esc(Logic.suggestedPrice(valueInfo(cur) && valueInfo(cur).value, f.format, s))}" value="${esc(f.final)}"></div></div>
        <div class="field"><label for="boxIn">Box or shelf <span class="muted">(optional)</span></label>
          <input id="boxIn" data-f="box" class="text-input" value="${esc(f.box)}" placeholder="e.g. Box 12"></div>
        <div class="field"><label for="notesIn">Notes <span class="muted">(optional)</span></label>
          <textarea id="notesIn" data-f="notes" class="text-input" placeholder="Anything worth remembering">${esc(f.notes)}</textarea></div>
        <div class="actions"><button type="button" class="btn" data-act="skip">Skip</button>
          <button type="button" class="btn go" data-act="save" ${cur.saving ? 'disabled' : ''}>${cur.saving ? 'Saving…' : '✅ Save to list'}</button></div></div>`);
    } else if (detailed && cur.saved) {
      html.push(`<div class="card"><p class="msg ok" style="font-size:1.1rem;margin:0 0 12px">✅ ${cur.saved.action === 'addedCopy'
        ? `Added to the existing entry — now ${esc(cur.saved.copies)} copies.` : `Saved to the list as ${esc(cur.saved.id)}.`}</p>
        <button type="button" class="btn primary wide" data-act="next">Next book</button></div>`);
    } else {
      html.push(`<div class="actions" style="margin:14px 0 0;padding:0;background:none;position:static"><button type="button" class="btn primary wide" data-act="next">Next book</button></div>`);
    }

    // Re-render without losing the place the person is typing.
    const active = document.activeElement;
    const activeF = keepFocus && active && active.dataset && active.dataset.f;
    const selStart = active && active.selectionStart;
    const r = $('#result');
    r.innerHTML = html.join('');
    r.classList.remove('hidden');
    if (activeF) {
      const el = $(`[data-f="${activeF}"]`, r);
      if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text box */ } }
    }
  }

  /** Light update while typing (no full re-render). */
  function refreshVerdict() {
    const cur = S.current;
    if (!cur || cur.kind !== 'book') return;
    $('#verdictSlot').innerHTML = verdictHtml(cur);
    $('#suggestSlot').innerHTML = suggestHtml(cur);
    const note = $('#estNote');
    if (note) {
      note.innerHTML = num(cur.yourEst) != null
        ? `Using your number. <button type="button" class="linkish" data-act="clearEst">Use the system's number instead</button>`
        : 'If you know better, type what you think it’s worth. Your number replaces the system’s guess.';
    }
  }

  async function saveCurrent() {
    const cur = S.current;
    if (!cur || cur.kind !== 'book' || cur.saving) return false;
    if (!S.who) await pickName();
    const f = cur.form;
    const look = cur.look || {};
    const e = look.ebay && !look.ebay.error && !look.ebay.notConfigured ? look.ebay : {};
    const k = look.keepa && look.keepa.found ? look.keepa : {};
    const est = look.estimate || {};
    const m = cur.meta || {};
    const autoWhere = Logic.whereToSell(valueInfo(cur) && valueInfo(cur).value, S.settings);
    const book = {
      isbn13: cur.p ? cur.p.isbn13 : '', title: m.title || '', author: m.author || '', year: m.year || '', publisher: m.publisher || '',
      coverUrl: m.cover || '', format: f.format, condition: f.condition,
      special: [f.first && 'First edition', f.signed && 'Signed'].filter(Boolean).join(', '),
      copies: Math.max(1, parseInt(f.copies, 10) || 1), searched: S.cond,
      ebayCount: e.used, ebayLow: e.low, ebayMedian: e.median,
      amzUsed: k.usedAvg90 || k.usedNow || '', amzRank: k.salesRank || '',
      sysEst: est.value, basis: est.basis ? est.basis + (est.lowData && est.value != null ? ' (not much data)' : '') : '',
      yourEst: num(cur.yourEst) != null ? num(cur.yourEst) : '', yourEstBy: S.who,
      final: num(f.final) != null ? num(f.final) : '',
      where: f.where && f.where !== autoWhere ? f.where : '',
      box: f.box.trim(), notes: f.notes.trim(), by: S.who, mode: 'One at a Time',
    };
    const dupId = look.dup && f.dupChoice === 'addCopy' ? look.dup.id : null;
    cur.saving = true; renderBook();
    try {
      const r = await api('save', { book, dupId });
      cur.saved = r;
      ls.set('lastBox', book.box);
      beep(true);
      toast(r.action === 'addedCopy' ? `Added — now ${r.copies} copies` : `Saved ✓ (${r.id})`);
      return true;
    } catch (err) {
      beep(false);
      toast('Not saved: ' + err.message, 5000);
      return false;
    } finally {
      cur.saving = false;
      if (S.current === cur) renderBook();
    }
  }

  function nextBook() {
    S.current = null;
    $('#result').classList.add('hidden');
    $('#result').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setMsg('Ready for the next book.', 'ok');
    focusInput();
  }

  // Taps and typing inside the result card.
  $('#result').addEventListener('click', async (e) => {
    const cur = S.current;
    if (!cur) return;
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    const group = btn.parentElement && btn.parentElement.dataset.group;
    if (cur.kind === 'sold') return soldClick(btn, act);
    if (group) { cur.form[group] = btn.dataset.v; cur.dirty = true; renderBook(); return; }
    if (btn.dataset.toggle) { cur.form[btn.dataset.toggle] = !cur.form[btn.dataset.toggle]; cur.dirty = true; renderBook(); return; }
    if (act === 'copies-' || act === 'copies+') {
      cur.form.copies = Math.max(1, (parseInt(cur.form.copies, 10) || 1) + (act === 'copies+' ? 1 : -1));
      cur.dirty = true; renderBook(); return;
    }
    if (act === 'clearEst') { cur.yourEst = ''; const i = $('#yourEst'); if (i) i.value = ''; refreshVerdict(); return; }
    if (act === 'save') { await saveCurrent(); return; }
    if (act === 'skip' || act === 'next') nextBook();
  });

  $('#result').addEventListener('input', (e) => {
    const cur = S.current;
    const f = e.target.dataset.f;
    if (!cur || !f) return;
    if (cur.kind === 'sold') { cur[f] = e.target.value; return; }
    if (f === 'yourEst') { cur.yourEst = e.target.value.replace(/[^0-9.]/g, ''); cur.dirty = true; refreshVerdict(); return; }
    cur.form[f] = e.target.value;
    cur.dirty = true;
    if (f === 'final' || f === 'copies') return;
  });

  /* ---------------- Rapid Scan ---------------- */
  let lastRapid = { key: '', at: 0 };

  function rapidAdd({ p, meta }) {
    const key = p ? p.isbn13 : 't:' + (meta && meta.title);
    // Ignore the same barcode read twice in a row by accident.
    if (key === lastRapid.key && Date.now() - lastRapid.at < 3000) return;
    lastRapid = { key, at: Date.now() };
    if (!S.who) { pickName(); }
    beep(true);
    const item = { n: S.rapid.length + 1, p, meta: meta || null, status: 'wait', title: (meta && meta.title) || '', res: null, err: '' };
    S.rapid.unshift(item);
    S.queue.push(item);
    renderRapid();
    pumpQueue();
    return item;
  }

  function pumpQueue() {
    while (S.running < 2 && S.queue.length) {
      const item = S.queue.shift();
      S.running++;
      api('rapidSave', {
        isbn: item.p ? item.p.isbn13 : '', title: item.meta && item.meta.title, author: item.meta && item.meta.author,
        condition: S.cond, by: S.who,
      }).then((r) => {
        item.res = r;
        item.title = r.title || item.title;
        item.status = r.pending ? 'pending' : r.dup ? 'dup' : 'done';
      }).catch((e) => {
        item.status = 'err'; item.err = e.message;
      }).finally(() => {
        S.running--;
        renderRapid();
        pumpQueue();
      });
    }

  async function soldOpen({ p, meta }) {
    beep(true);
    const cur = { kind: 'sold', p: p || null, meta: meta || null, metaDone: !!meta || !p, book: undefined, price: '', qty: 1, saving: false, err: '' };
    S.current = cur;
    renderSold();
    if (!meta && p) fetchMeta(p).then((m) => { if (S.current === cur) { cur.meta = m; cur.metaDone = true; renderSold(); } });
    try {
      const r = await api('findBook', { isbn: p ? p.isbn13 : '', title: meta && meta.title, author: meta && meta.author });
      if (S.current !== cur) return;
      cur.book = r.book;
      if (r.book && cur.price === '') {
        const pr = r.book.final != null ? r.book.final : r.book.suggested;
        cur.price = pr != null ? Number(pr).toFixed(2) : '';
      }
    } catch (e) {
      if (S.current !== cur) return;
      cur.book = null; cur.err = e.message;
    }
    renderSold();

  async function soldClick(btn, act) {
    const cur = S.current;

  const SCAN_LIB = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  let lastCam = { code: '', at: 0 };

  function scanFormats() {
    const F = window.Html5QrcodeSupportedFormats;
    return [F.EAN_13, F.UPC_A, F.EAN_8];
  }

  async function openCamera() {
    const rapid = S.mode === 'rapid';
    showModal(`<h2>Point the camera at the barcode</h2>

    stopCamera);
    $('#camDone').addEventListener('click', hideModal);
    try {
      await loadScript(SCAN_LIB);
      const scanner = new window.Html5Qrcode('camReader', {
        formatsToSupport: scanFormats(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      });
      S.cam = scanner;
      await scanner.start({ facingMode: 'environment' }, {
        fps: 10,
        qrbox: (w, h) => ({ width: Math.max(50, Math.floor(w * 0.85)), height: Math.max(50, Math.floor(Math.min(h * 0.45, w * 0.45))) }),
      }, onCamCode, () => {});
    } catch (e) {
      // Live camera blocked (common when the page is served by Apps Script). Use the phone's camera app instead.
      S.liveCamFailed = true;
      S.cam = null;
      if (!modalOpen()) return;
      showModal(`<h2>Take a photo of the barcode</h2>
        <p>This phone won't let the page use the camera directly, so take a quick photo instead. The page reads the barcode from the photo.</p>

        <button id="camType" class="btn wide" type="button">Type the ISBN instead</button></div>`);

  function camFlash(text, ok) {
    const f = $('#camFlash');
    if (!f) return;
    f.textContent = text;
    f.style.background = ok ? 'rgba(21,128,61,.92)' : 'rgba(185,28,28,.92)';
    f.classList.remove('hidden');
    clearTimeout(camFlash.t);
    camFlash.t = setTimeout(() => f.classList.add('hidden'), 2200);
  }

  async function onCamCode(text) {
    if (text === lastCam.code && Date.now() - lastCam.at < 2500) return;
    lastCam = { code: text, at: Date.now() };
    const p = ISBN.parse(text);
    if (!p.ok) { beep(false); camFlash(p.reason === 'notbook' || p.reason === 'upc' ? 'That’s a store barcode, not the ISBN.' : p.message, false); return; }
    if (S.mode === 'rapid') {
      rapidAdd({ p });
      camFlash('✓ Scanned ' + p.isbn13 + ' — next book', true);
      return;
    }
    hideModal();
    await dispatch({ p });
  }

  function stopCamera() {
    const sc = S.cam;
    S.cam = null;
    if (sc) sc.stop().then(() => sc.clear()).catch(() => {});
    focusInput();
  }

  /* ---------------- Photo of the ISBN ---------------- */
  const OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

  async function readPhoto(file) {
    showModal(`<h2>Reading your photo…</h2><p class="loading"><span class="spinner"></span> Looking for a barcode or ISBN numbers. The first time can take 10–20 seconds.</p>
      <div id="photoScratch" style="display:none"></div>`);
    let found = [];
    try {
      await loadScript(SCAN_LIB);
      const h = new window.Html5Qrcode('photoScratch', { formatsToSupport: scanFormats(), verbose: false });
      const code = await h.scanFile(file, false);
      const p = ISBN.parse(code);
      if (p.ok) found = [p];
    } catch (e) { /* no barcode in the photo — read the printed numbers instead */ }
    if (!found.length) {
      try {
        await loadScript(OCR_LIB);
        const res = await window.Tesseract.recognize(file, 'eng');
        found = ISBN.findInText((res && res.data && res.data.text) || '');
      } catch (e) {
        found = [];
      }
    }
    if (!modalOpen()) return;
    if (found.length === 1) { hideModal(); return dispatch({ p: found[0] }); }
    if (found.length > 1) {
      showModal(`<h2>Which ISBN is it?</h2><p>The photo had more than one.</p><div class="stack">${found.map((p, i) =>
        `<button class="btn wide" data-i="${i}" type="button">${esc(p.isbn13)}</button>`).join('')}</div>`);
      $$('#modal [data-i]').forEach((b) => b.addEventListener('click', () => { hideModal(); dispatch({ p: found[+b.dataset.i] }); }));
      return;
    }
    showModal(`<h2>Couldn't find an ISBN</h2><p>Try another photo: get close to the ISBN or barcode, in good light, and hold steady. Or type the numbers in.</p>
      <div class="stack"><button class="btn primary wide" id="photoAgain" type="button">📷 Take another photo</button>
      <button class="btn wide" id="photoClose" type="button">Type it instead</button></div>`);
    $('#photoAgain').addEventListener('click', () => { hideModal(); $('#photoInput').click(); });
    $('#photoClose').addEventListener('click', () => { hideModal(); $('#isbnInput').focus(); });
  }

  /* ---------------- Barcode scanners that act like a keyboard ---------------- */
  // A USB/Bluetooth scanner "types" the digits very fast and presses Enter.
  // We catch that anywhere on the page, even if the cursor is in another box.
  const burst = { chars: '', start: 0, last: 0, target: null, before: '' };
  document.addEventListener('keydown', (e) => {
    if (!$('#settingsView').classList.contains('hidden')) return;
    if (modalOpen() && !S.cam) return;
    const now = performance.now();
    if (/^[0-9Xx]$/.test(e.key)) {
      if (now - burst.last > 60) {
        burst.chars = ''; burst.start = now; burst.target = e.target;
        burst.before = e.target && 'value' in e.target ? e.target.value : '';
      }
      burst.chars += e.key; burst.last = now;
      return;
    }
    if (e.key === 'Enter' && burst.chars.length >= 10 && now - burst.last < 100) {
      const avg = (burst.last - burst.start) / Math.max(1, burst.chars.length - 1);
      if (avg < 45) {
        e.preventDefault(); e.stopPropagation();
        const code = burst.chars;
        const t = burst.target;
        if (t && 'value' in t && t.id !== 'isbnInput') { t.value = burst.before; }
        burst.chars = '';
        if (S.cam) { onCamCode(code); return; }
        $('#isbnInput').value = '';
        handleCode(code);
      }
    }
  }, true);

        </div>
        ${shareLink ? `<div class="set-field" style="margin-top:12px"><label for="shareLink">Link for volunteers (includes the team code)</label>
          <input id="shareLink" type="text" readonly value="${esc(shareLink)}"><div class="help">Send this link to volunteers and have them add it to their home screen. It signs them in every time.</div>
          <button id="copyLink" class="btn small" type="button" style="margin-top:6px">Copy link</button></div>` : ''}</div>

      <div class="card"><h2>General</h2>
        <div class="set-grid">${f('appName', 'Name at the top of the page', '', 'text')}</div>
        ${info.sheetUrl ? `<p><a class="btn wide" href="${esc(info.sheetUrl)}" target="_blank" rel="noopener">📊 Open the spreadsheet (${esc(info.bookCount)} books)</a></p>` : `<p class="muted">${esc(info.bookCount)} books saved in practice mode.</p>`}
        ${info.practice ? '<button id="practiceReset" class="btn small" type="button">Clear practice data</button>' : ''}</div>

      <div id="setMsg" class="msg" role="status"></div>
      <div class="save-bar"><button id="setSave" class="btn go wide" type="button">Save settings</button></div>`;

    $('#scanView').classList.add('hidden');
    $('#settingsView').classList.remove('hidden');
    window.scrollTo(0, 0);
    $('#setBack').addEventListener('click', closeSettings);
    $('#setSave').addEventListener('click', saveSettings);
    const copy = $('#copyLink');
    if (copy) copy.addEventListener('click', () => { $('#shareLink').select(); try { navigator.clipboard.writeText(shareLink); } catch (e) { document.execCommand('copy'); } toast('Link copied'); });
    const reset = $('#practiceReset');
    if (reset) reset.addEventListener('click', () => { window.DemoBackend.reset(); toast('Practice data cleared'); closeSettings(); });
  }

  async function saveSettings() {
    const out = {};
    $$('#settingsView [data-k]').forEach((el) => {
      const k = el.dataset.k;
      const d = window.DEFAULT_SETTINGS[k];
      if (el.type === 'checkbox') out[k] = el.checked;
      else if (typeof d === 'number') out[k] = el.value === '' ? d : Number(el.value);
      else out[k] = el.value;
    });
    const msg = $('#setMsg');
    const bad = Object.keys(out).find((k) => typeof window.DEFAULT_SETTINGS[k] === 'number' && !isFinite(out[k]));
    if (bad) { msg.className = 'msg err'; msg.textContent = 'Please use plain numbers (no $ signs).'; return; }
    if (!(out.tier2Min < out.tier3Min && out.tier3Min < out.tier4Min)) {
      msg.className = 'msg err'; msg.textContent = 'Each value level must start higher than the one before it.'; return;
    }
    const secrets = {};
    $$('#settingsView [data-sec]').forEach((el) => { if (el.value.trim()) secrets[el.dataset.sec] = el.value.trim(); });
    $('#setSave').disabled = true;
    msg.className = 'msg'; msg.innerHTML = '<span class="spinner"></span> Saving…';
    try {
      const info = await api('saveSettings', { pin: S.admin.pin, settings: out, secrets });
      if (secrets.adminPin) S.admin.pin = secrets.adminPin;
      if (secrets.teamCode) ls.set('team', secrets.teamCode);
      S.admin.info = info;
      applySettings(info.settings);
      S.ebayReady = info.ebayReady; S.keepaReady = info.keepaReady;
      showSettings();
      const m = $('#setMsg');
      if (info.ebayTest && info.ebayTest !== 'ok') { m.className = 'msg err'; m.textContent = 'Saved, but eBay did not accept the keys: ' + info.ebayTest; }
      else { m.className = 'msg ok'; m.textContent = 'Saved ✓' + (info.ebayTest === 'ok' ? ' eBay is connected.' : ''); }
      toast('Settings saved ✓');
    } catch (e) {
      msg.className = 'msg err'; msg.textContent = 'Not saved: ' + e.message;
      $('#setSave').disabled = false;
    }
  }

  function closeSettings() {
    S.admin = null;
    $('#settingsView').classList.add('hidden');
    $('#settingsView').innerHTML = '';
    $('#scanView').classList.remove('hidden');
    setMode(S.mode);
  }

  /* ---------------- Wire up + start ---------------- */
  $$('.mode').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $$('[data-cond]').forEach((b) => b.addEventListener('click', () => setCond(b.dataset.cond)));
  $('#isbnForm').addEventListener('submit', (e) => { e.preventDefault(); handleCode($('#isbnInput').value); });
  // After live camera has failed once on this visit, go straight to the photo method.
  $('#camBtn').addEventListener('click', () => (S.liveCamFailed ? $('#photoInput').click() : openCamera()));
  $('#photoBtn').addEventListener('click', () => $('#photoInput').click());
  $('#photoInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) readPhoto(file);
  });
  $('#titleBtn').addEventListener('click', openTitleSearch);
  $('#whoBtn').addEventListener('click', pickName);
  $('#gearBtn').addEventListener('click', openSettingsLogin);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOpen()) hideModal(); });

  /** The volunteer link carries the team code: #team=… on a normal website, ?team=… on the Apps Script URL. */
  function readTeamFromLink() {
    if (IN_GAS && google.script.url) {
      return new Promise((resolve) => {
        google.script.url.getLocation((loc) => {
          const t = loc && loc.parameter && loc.parameter.team;
          if (t) ls.set('team', t);
          resolve();
        });
        setTimeout(resolve, 2000);
      });
    }
    const m = location.hash.match(/team=([^&]+)/);
    if (m) {
      ls.set('team', decodeURIComponent(m[1]));
      history.replaceState(null, '', location.pathname + location.search);
    }
    return Promise.resolve();
  }

  (async function start() {
    if (PRACTICE) $('#demoBanner').classList.remove('hidden');
    applySettings(S.settings);
    $('#whoName').textContent = S.who || 'Your name';
    setCond(S.cond);
    setMode(MODE_LABEL[S.mode] ? S.mode : 'quick');
    await readTeamFromLink();
    hello();
  })();
})();

</script>
</body>
</html>
